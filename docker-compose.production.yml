name: monitor-system-production

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PG_DB:-monitor}
      POSTGRES_USER: ${PG_USER:-monitor}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env.production 设置 PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -q"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  backend:
    # 固定镜像名 + 版本 tag（复查清单 P2-3）：只有 build: 时，"回退到上一版"这件事
    # 没有落脚点——上一版镜像压根不存在。带上 image: 之后每次构建都会打上 tag，
    # 回退就是 IMAGE_TAG=<上一版> docker compose ... up -d（不重新构建）。
    # 默认值 local 只是为了让本地开发不配环境变量也能跑；正式部署应显式给版本号
    # （如 IMAGE_TAG=2026.09.18-1），并把它写进发布记录。
    image: monitor-backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      PG_HOST: db
      PG_PORT: 5432
      PG_DB: ${PG_DB:-monitor}
      PG_USER: ${PG_USER:-monitor}
      PG_PASSWORD: ${PG_PASSWORD:?请在 .env.production 设置 PG_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env.production 设置至少32字节的 JWT_SECRET}
      MONITOR_INGEST_KEY: ${MONITOR_INGEST_KEY:?请在 .env.production 设置随机 INGEST 密钥}
      INGEST_STRICT_CONTRACT: "true"
      INGEST_MAX_BATCH_SIZE: ${INGEST_MAX_BATCH_SIZE:-2000}
      # 时钟偏差容忍（秒），与 dev 编排和 application.yml 都是同一个 300。
      # 见 docker-compose.yml 里的说明：这不是安全姿态，不该 dev/prod 不同。
      INGEST_MAX_COLLECT_AHEAD_SECONDS: ${INGEST_MAX_COLLECT_AHEAD_SECONDS:-300}
      INGEST_MAX_RECEIVE_AHEAD_SECONDS: ${INGEST_MAX_RECEIVE_AHEAD_SECONDS:-300}
      # 演示账号初始化：postgres profile 已默认关闭（application-postgres.yml），
      # 这里再显式写一遍是为了让「这个部署不建演示账号」在编排文件里就能读到。
      MONITOR_DEMO_ACCOUNTS: ${MONITOR_DEMO_ACCOUNTS:-false}
      # 测量值保留（P1-1）：**默认关闭**——删数据不可逆，打开这件事必须由部署的人显式决定。
      # 打开方式（把下面两行取消注释并填好天数）：
      #   MONITOR_RETENTION_ENABLED: "true"
      #   MONITOR_RETENTION_RAW_DAYS: "90"
      # 口径与取舍（分批、单轮上限、只删 measurement、可观测）见
      # backend/src/main/java/com/monitor/telemetry/service/MeasurementRetentionJob.java 与
      # docs/容量与保留策略_20260920.md；打开后 /ops 的「运行配置」会显示保留天数与上轮删除行数。
      UPLOAD_DIR: /app/data/media
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    volumes:
      - media:/app/data/media
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      # readiness（P0-6）：/api/v1/health 只是 liveness（无条件 UP），数据库不可用时
      # 容器会一直是 (healthy)。这个端点执行 SELECT 1 + 连接池判定，失败即 503。
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  frontend:
    image: monitor-frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        VITE_SCENE_MODE: mountain
        VITE_CESIUM_ION_TOKEN: ""
        VITE_TERRAIN_MODE: none
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${DIGITAL_TWIN_ASSET_DIR:-./frontend/public/models}:/usr/share/nginx/html/models:ro
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-80}:80"
    tmpfs:
      - /var/cache/nginx:size=128m
      - /var/run:size=16m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  pgdata:
  media:
