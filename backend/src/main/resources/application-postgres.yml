# 阶段 2 联调 / Docker Compose 使用：PostgreSQL 持久化
# 启动：./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:monitor}
    driver-class-name: org.postgresql.Driver
    username: ${PG_USER:monitor}
    password: ${PG_PASSWORD:monitor}
  # H2 控制台在基础 application.yml 里是开着的，这里必须显式关掉（B-7）。
  # 它的自动配置条件只有「servlet 应用 + classpath 有 JakartaWebServlet + 该开关为 true」，
  # **没有一条与数据源类型有关**；而 H2 是 runtime scope，各 profile 的 classpath 上都有。
  # 实测后果（postgres profile，Docker Compose 部署形态）：GET /h2-console/ → 200，
  # 无需任何凭证即进入登录页，而那里能自行填任意 JDBC URL——包括这个 PG 库。
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# 演示账号初始化（DataInitializer）在 postgres profile 下默认关闭。
#
# 为什么把 false 放在这里、而不是靠部署方去设环境变量：生产跑的就是 postgres profile，
# 于是「生产不建五个统一口令的账号」是一个默认成立的事实，而不是一条要记得执行的步骤。
# 现场确实需要演示时用 MONITOR_DEMO_ACCOUNTS=true 显式打开。
#
# 注意本 profile 不止生产在用：dev 的 docker-compose.yml 也走 postgres，所以那里显式设了
# MONITOR_DEMO_ACCOUNTS=true（否则全新 dev 卷起来后一个账号都没有，谁都登不进去，
# 而 10-scope.sh 还需要其中的 outsider 做隔离对照组）。安全默认值在这里，dev 的豁免在编排文件里。
monitor:
  demo-accounts:
    enabled: ${MONITOR_DEMO_ACCOUNTS:false}
