spring:
  application:
    name: monitor-backend
  # 阶段 1：H2 内存库（零配置，两端一致）；阶段 2 切 application-postgres.yml
  datasource:
    # LOCK_TIMEOUT=10000 不是调优，是为了让 H2 与 PostgreSQL 的**并发行为一致**。
    # H2 默认行锁等待只有 ~2000ms，到点抛 JdbcSQLTimeoutException(50200)，Spring 转成
    # CannotAcquireLockException；而 PostgreSQL 是等前一个事务提交后按新版本重新判定
    # WHERE，返回 0 行（CAS 失败）。加大到 10s 后，H2 也会等到对方提交、按新版本判定：
    # 我们的 CAS 与「未解除唯一键」(V14) 在本地就能测出与生产相同的结果。
    # 不加这一条的话，本地唯一观察得到的现象是「锁超时」，而真正的语义（0 行 / 23505）
    # 只在生产出现——那正是无法在本地复现的并发 bug 的温床。
    url: jdbc:h2:mem:monitor;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # 注意：date-format 只影响 java.util.Date，对 JSR-310（LocalDateTime）**无效**，
    # 曾因此让档案时间裸出 "2026-08-27T15:05:00" 无偏移。时间口径现由
    # JacksonTimeConfig 统一走 Times.iso（ISO8601 带 +08:00），不要再靠这里配置。
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.monitor: debug

# 业务自定义配置
monitor:
  jwt:
    # 演示用占位密钥，生产/联调通过环境变量覆盖（HS256 需 >= 32 字节）
    secret: ${JWT_SECRET:monitor-system-demo-secret-key-please-change-in-prod-0123456789}
    # 过期时间（毫秒），默认 24h
    expiration: ${JWT_EXPIRATION:86400000}
  # 登录失败限流（复查清单 P1-14）。口径与两条边界（进程内存、只挡猜口令不挡流量）
  # 见 LoginAttemptGuard 的类注释；这里只放两个可调数字，判据本身是常量。
  auth:
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-lock-seconds: ${LOGIN_LOCK_SECONDS:300}
  upload:
    dir: ${UPLOAD_DIR:./data/media}
  # 设备离线扫描（验收第 5 条：断连 -> 设备告警）。
  # 判据复用 DeviceStatusPolicy.OFFLINE_MINUTES（5 分钟未上报视为离线），这里只管「多久扫一次」：
  # 默认 10s 是演示观感与开销的折中——断连后最多 10s 就出告警，而一次扫描只是几条内存比较。
  device-offline:
    sweep-ms: ${DEVICE_OFFLINE_SWEEP_MS:10000}
  # 数据可信度扫描（数据质量异常 / 数据延迟上报）。
  # 判据本身是常量（DataQualityPolicy），与 device-offline 的分工一致：只有「多久扫一次」可配。
  # 常量不进配置，是因为它们同时被告警快照读去展示——判据两处各写一份迟早漂移。
  data-quality:
    sweep-ms: ${DATA_QUALITY_SWEEP_MS:10000}
  # 测量值保留（复查清单 P1-1：容量与保留策略）。
  # **默认关闭**：删数据不可逆，默认打开意味着任何一次本地启动、任何一套演示库都可能真删。
  # 开启方式：MONITOR_RETENTION_ENABLED=true（生产编排里显式打开并给出保留天数）。
  # 口径与取舍（分批删、每轮上限、只删测量值）见 MeasurementRetentionJob 的类注释；
  # 容量预算与分区演进的完整算法见 docs/容量与保留策略_20260920.md。
  retention:
    enabled: ${MONITOR_RETENTION_ENABLED:false}
    raw-days: ${MONITOR_RETENTION_RAW_DAYS:90}
    batch-size: ${MONITOR_RETENTION_BATCH_SIZE:5000}
    max-rows-per-sweep: ${MONITOR_RETENTION_MAX_ROWS_PER_SWEEP:200000}
    batch-pause-ms: ${MONITOR_RETENTION_BATCH_PAUSE_MS:200}
    sweep-ms: ${MONITOR_RETENTION_SWEEP_MS:3600000}
    initial-delay-ms: ${MONITOR_RETENTION_INITIAL_DELAY_MS:60000}
  # ingest 接入共享密钥（M0-D7）：无网关，/api/v1/ingest/** 校验 X-Ingest-Key 头
  # dev 默认值已与 B 统一为 dev-ingest-key（B 上报脚本默认同此值，见 B 答复 2026-09-09）；
  # 联调/生产用环境变量 MONITOR_INGEST_KEY 覆盖此默认值（与 B 协商一致的密钥）
  ingest-key: ${MONITOR_INGEST_KEY:dev-ingest-key}
  ingest:
    # 开发默认兼容旧演示消息；生产编排会通过环境变量强制打开标准消息校验。
    strict-contract: ${INGEST_STRICT_CONTRACT:false}
    # 允许 1000 点同刻一次上报，并为异常超大请求设置内存/SQL 参数上限。
    max-batch-size: ${INGEST_MAX_BATCH_SIZE:2000}
    # 时钟偏差容忍（秒），见 IngestTimePolicy：采集时间超前平台时间超过它即拒收
    # （COLLECT_TIME_IN_FUTURE），接收时间超前超过它则钳到当前。300 秒与
    # DeviceStatusPolicy.OFFLINE_MINUTES 同量级，且远大于任何合理的网关缓冲。
    max-collect-ahead-seconds: ${INGEST_MAX_COLLECT_AHEAD_SECONDS:300}
    max-receive-ahead-seconds: ${INGEST_MAX_RECEIVE_AHEAD_SECONDS:300}
