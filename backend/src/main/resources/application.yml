spring:
  application:
    name: monitor-backend
  # 阶段 1：H2 内存库（零配置，两端一致）；阶段 2 切 application-postgres.yml
  datasource:
    url: jdbc:h2:mem:monitor;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.monitor: debug

# 业务自定义配置
monitor:
  jwt:
    # 演示用占位密钥，生产/联调通过环境变量覆盖（HS256 需 >= 32 字节）
    secret: ${JWT_SECRET:monitor-system-demo-secret-key-please-change-in-prod-0123456789}
    # 过期时间（毫秒），默认 24h
    expiration: ${JWT_EXPIRATION:86400000}
  upload:
    dir: ${UPLOAD_DIR:./data/media}
  # ingest 接入共享密钥（M0-D7）：无网关，/api/v1/ingest/** 校验 X-Ingest-Key 头
  # 联调/生产用环境变量 MONITOR_INGEST_KEY 覆盖此默认值（与 B 协商一致的密钥）
  ingest-key: ${MONITOR_INGEST_KEY:monitor-ingest-demo-key-2026}
