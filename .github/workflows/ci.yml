# 持续集成（复查清单 P2-2）：把「记得跑」变成「每次必跑」。
#
# 三个 job 的分工：
#   backend-tests   后端单测（H2 内存库，不需要外部服务）
#   backend-accept  16 套验收（run-all --fresh 自己起一个空库后端；含自带后端的 16 号严格契约套件）
#   frontend        构建 + 源码绊线 + 对着真后端的前端自检
#
# 为什么验收也放进 CI：本仓的回归网（556 条断言）此前只能靠人记得跑，
# 而"记得跑"在本仓的历史里已经失败过多次（清单 P1-13 记的就是这件事）。
#
# 为什么不用 `-o`（离线）：CI 上没有预热的 ~/.m2，必须走在线；本地默认离线是另一码事。
# MVNW_OPTS 在这里显式传成 "-B"，run-all.sh 里 `${MVNW_OPTS:--o}` 的空值判断会照用这个值。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支上后一次推送取消前一次未跑完的 CI（省 runner，也让结果对应最新代码）
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 后端单元测试
        run: cd backend && ./mvnw -B test

  backend-acceptance:
    runs-on: ubuntu-latest
    # 刻意**不**给这个 job 设 TZ：GitHub runner 默认是 UTC，而平台的时间口径是
    # Asia/Shanghai（应用在 main 第一行把 JVM 默认时区钉死，见 MonitorApplication）。
    # 2026-09-18 正是这个组合抓出一个真 bug：容器里有 TZ=Asia/Shanghai 盖着，
    # 裸机/CI 上却让"现在的报文"被判成 8 小时后的未来而整批拒收。
    # 给 CI 设 TZ 会把这类问题重新盖住——所以这里留白是**故意的**。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # run-all.sh 需要 ss（iproute2）与 curl；ubuntu-latest 自带，这里只做显式声明
      - name: 验收套件（H2 空库）
        env:
          # 后端日志留到固定路径：失败时 artifact 与 job summary 都靠它
          KEEP_LOG: ${{ runner.temp }}/acceptance-backend.log
        run: |
          set -o pipefail
          FRESH_PORT=18085 MVNW_OPTS="-B" tools/acceptance/run-all.sh --fresh 2>&1 \
            | tee "$RUNNER_TEMP/acceptance-run.log"
        timeout-minutes: 30
      - name: 结果写进 job summary（不必展开步骤就能看到哪一套红了）
        if: always()
        run: |
          LOG="$RUNNER_TEMP/acceptance-run.log"
          [ -f "$LOG" ] || exit 0
          {
            echo '## 验收结果'
            echo '```'
            grep -E '^(---- .*(通过|失败)|  ✗|  套件|  未通过|  全部通过)' "$LOG" | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # 把失败摘要做成 **check run annotation**：它连匿名读取都能拿到
      # （`GET /repos/{owner}/{repo}/check-runs/{id}/annotations`），
      # 而 job summary 与 artifact 都要鉴权——本地排查 CI 时差别很大（2026-09-20 实测）。
      - name: 失败时把关键行做成注解（可被 checks API 读到）
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/acceptance-run.log"
          [ -f "$LOG" ] || exit 0
          grep -E '^---- .*(通过|失败)|^  ✗|^  未通过|^  套件' "$LOG" | tail -25 | while IFS= read -r line; do
            echo "::error title=验收失败::${line}"
          done
      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-logs
          path: |
            ${{ runner.temp }}/acceptance-run.log
            ${{ runner.temp }}/acceptance-backend.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 安装依赖
        run: cd frontend && npm ci
      - name: 构建
        run: cd frontend && npm run build
      - name: 源码绊线（P0 第 1 批 35 项）
        run: cd frontend && node scripts/check-p0-stage1.mjs
      - name: 启动后端（前端自检要用到 8080）
        run: |
          cd backend
          # setsid + nohup：让后端脱离本步骤的进程组，步骤结束后仍活着给下一步用
          setsid nohup ./mvnw -B -DskipTests spring-boot:run > /tmp/backend-selfcheck.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/api/v1/health/ready > /dev/null; then
              echo "后端已就绪（${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "后端在 120s 内未就绪" >&2
          tail -50 /tmp/backend-selfcheck.log >&2
          exit 1
      - name: 前端自检（79 条，含回放粒度与窗口口径）
        run: cd frontend && npm run selfcheck
