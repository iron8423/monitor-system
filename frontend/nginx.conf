# 前端容器的站点配置（落到 nginx 的 /etc/nginx/conf.d/default.conf）。
#
# 前端只请求同源的 /api/**，由这里反代到 backend:8080——所以后端不需要配 CORS，
# 和生产形态的口径也一致（开发期是 vite.config.js 的代理在做同一件事）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 构建产物带内容哈希，文件名一变就是新资源，可以放心长缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cesium 运行时资源（Workers/Assets/Widgets/ThirdParty）文件名**不带哈希**，
    # 不能长缓存：否则换了 Cesium 版本后，浏览器拿旧缓存去配新产物，大屏加载到
    # 不匹配的 Worker/贴图，症状是「代码升级了但表现没变」。
    location /cesium/ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 生产数字孪生资产由只读卷挂载。配置里的 assetVersion 负责版本识别；这里要求
    # 浏览器每次验证 ETag/Last-Modified，避免替换同名模型后仍看到旧缓存。
    location /models/ {
        expires -1;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML 入口每次向服务器验证，避免更新后继续引用旧的哈希分包。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA 回落：vue-router 用的是 history 模式，所以 /screen、/points 这些深链接
    # 在服务端并没有对应文件。直接访问或在页内刷新时，必须交给 index.html 让前端
    # 路由去解析——少了这条，深链接一律 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 普通接口反代
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 单独一条。nginx 的前缀 location 取**最长匹配**，所以 /api/v1/stream
    # 会走这里而不是上面的 /api/——两条不冲突，顺序也无所谓。
    #
    # 为什么不复用 /api/：nginx 默认会缓冲上游响应，把事件攒在缓冲区里成批发。
    # 那样「实时推送」在浏览器侧就退化成不定时批量到达，顶栏的连接状态看着还是
    # 连上的——故障形态很隐蔽。这条长连接必须关缓冲、关缓存、把读写超时拉长。
    location /api/v1/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host   $host;
        # 置空而不是 upgrade：后端是普通 HTTP 长响应，不是 WebSocket
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 让每段事件尽快离开 nginx，不要在代理层攒
        chunked_transfer_encoding on;
    }
}
