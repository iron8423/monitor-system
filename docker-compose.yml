# 一键启动（对应验收脚本第 8 条：一键起、数据不丢、浏览器可访问）
#
#   docker compose up -d          # 起 db + backend
#   docker compose ps             # 两个服务都该是 healthy
#   docker compose down           # 停；数据留在卷里，下次 up 还在
#   docker compose down -v        # 连数据一起删（清干净重来时才用）
#
# 起来后：http://localhost:8080/swagger-ui.html   ← 后端可访问面
#         http://localhost:8080/api/v1/health
#
# 想改端口/密码/密钥：复制 .env.example 为 .env 再改（.env 不入库）。
#
# 前端也已进编排：访问 http://localhost 就是完整应用（工作台 + 3D 大屏），
# 不再是只能开后端自己的 swagger-ui。验收第 8 条「浏览器完整可访问」的落点。

name: monitor-system

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PG_DB:-monitor}
      POSTGRES_USER: ${PG_USER:-monitor}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-monitor}
    volumes:
      # 具名卷 —— 这就是第 8 条「服务重启数据不丢」的落点。
      # 注意不是 bind mount：bind mount 会把「数据在仓库目录里」变成事实，
      # 于是备份/权限/误删都变成仓库的事。
      - pgdata:/var/lib/postgresql/data
    ports:
      # 只为了能从宿主机用 psql/客户端连进去排查；容器之间走的是 db:5432，不经这里
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      # $$ 是 compose 的转义：这里要的是「容器内 shell 展开」，不是 compose 展开
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -q"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        # 等「真的能连」而不是「容器起来了」——PG 容器启动后还有一段 initdb 时间，
        # 只写 depends_on: [db] 会让后端在 PG 就绪前抢跑，Flyway 直接连不上
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      # 服务名即主机名：compose 的网络里 db 就是那台 PG
      PG_HOST: db
      PG_PORT: 5432
      PG_DB: ${PG_DB:-monitor}
      PG_USER: ${PG_USER:-monitor}
      PG_PASSWORD: ${PG_PASSWORD:-monitor}
      # 下面两个默认值与 application.yml 里的演示默认值一致，开箱即用；
      # 演示之外（真联调/上线）必须通过 .env 覆盖
      JWT_SECRET: ${JWT_SECRET:-monitor-system-demo-secret-key-please-change-in-prod-0123456789}
      MONITOR_INGEST_KEY: ${MONITOR_INGEST_KEY:-dev-ingest-key}
      # 生产编排默认拒绝错误版本、未知测项、未绑定设备/点以及非法质量枚举。
      INGEST_STRICT_CONTRACT: ${INGEST_STRICT_CONTRACT:-true}
      INGEST_MAX_BATCH_SIZE: ${INGEST_MAX_BATCH_SIZE:-2000}
      # 时钟偏差容忍（秒），两个默认值都写成 300 ——与 application.yml 一致。
      #
      # 刻意**不**复制紧邻上面那行 INGEST_STRICT_CONTRACT 的「app 默认 false、compose 默认 true」
      # 不对称：strict-contract 是安全姿态，dev 松、prod 紧是有意的；而时钟容差是物理常量，
      # 让 dev 与 prod 不同只会导致 dev 永远测不到 prod 的行为。照抄邻居是这里最大的诱惑。
      INGEST_MAX_COLLECT_AHEAD_SECONDS: ${INGEST_MAX_COLLECT_AHEAD_SECONDS:-300}
      INGEST_MAX_RECEIVE_AHEAD_SECONDS: ${INGEST_MAX_RECEIVE_AHEAD_SECONDS:-300}
      # 演示账号在本编排里**显式打开**。
      #
      # 为什么必须显式写：本编排用的也是 postgres profile，而该 profile 现在默认
      # `monitor.demo-accounts.enabled=false`（生产不建演示账号的安全默认值，见
      # application-postgres.yml）。不写这一行，一台全新的 dev 环境起来后一个账号都没有，
      # 谁都登不进去；而 10-scope.sh 还需要其中的 outsider 做数据隔离对照组。
      #
      # 也就是说：安全默认值归 postgres profile，dev 的便利在这里显式豁免一次。
      MONITOR_DEMO_ACCOUNTS: ${MONITOR_DEMO_ACCOUNTS:-true}
      UPLOAD_DIR: /app/data/media
    volumes:
      # 上传的无人机影像同样落卷：否则后端一重启，测点上的图就全丢了
      - media:/app/data/media
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      # Flyway 迁移 + 建 MyBatis 会话工厂要几秒到几十秒，这段里的失败不算数
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # 默认加载仓库内的低多边形山地 GLB，不请求 ion、地形或在线影像。
        VITE_SCENE_MODE: ${VITE_SCENE_MODE:-mountain}
        # Cesium ion token 是**构建期**内联进产物的，不是运行时读的——
        # 改它必须 `docker compose build frontend` 重建镜像，只 restart 不会生效。
        # 留空则大屏走「无地形兜底底图」的降级路径（不白屏，功能正常，只是没地形）。
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_TERRAIN_MODE: ${VITE_TERRAIN_MODE:-ion}
    depends_on:
      backend:
        # 等后端能应答 health 再起：nginx 自己不怕后端晚起，但这样
        # 「up 完就能用」成立，不必先刷出几个 502 再等
        condition: service_healthy
    volumes:
      # 运行期只读挂载：替换/增加 GLB 或 3D Tiles 不必重新构建前端镜像。
      - ${DIGITAL_TWIN_ASSET_DIR:-./frontend/public/models}:/usr/share/nginx/html/models:ro
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      # nginx:alpine 是 busybox，有 wget 没 curl。
      # ⚠️ 必须写 127.0.0.1，不能写 localhost：容器的 /etc/hosts 里 localhost 同时映射
      # 127.0.0.1 和 ::1，busybox 先试 ::1，而 nginx 只 listen 了 IPv4 的 80 ——
      # 于是健康检查永远是 "Connection refused"，容器长期显示 (unhealthy)，
      # 一旦有服务 depends_on: service_healthy 就会卡死在启动阶段。
      # （后端那侧写 localhost 没事，是因为 Tomcat 默认双栈绑定。）
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  media:
